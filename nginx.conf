server {
    listen 80;
    server_name localhost;
    
    # The root directory where the built React app lives
    root /usr/share/nginx/html;
    index index.html;

    # 1. GZIP COMPRESSION
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6; # Balance between CPU and Size
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    
    # Compress these file types
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 2. CACHING STRATEGY
    
    # Cache Static Assets (JS, CSS, Images) for 1 Year
    # Vite adds hashes to filenames (e.g., index.a4e2.js), so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache Media Files
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 1M;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 3. SPA ROUTING (Critical for React Router)
    # Any route that doesn't exist (e.g. /problems/two-sum) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html so users always get the latest version info
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Optional: Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}